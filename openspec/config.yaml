schema: spec-driven

context: |
  Project: pi-profile-switch, a Pi package. TypeScript ESM, Vitest, conventional commits.

  Language: prose in English by default; the README editions follow the authoring
  policy referenced below. Technical terms stay as-is. Notation that OpenSpec parsing
  depends on stays in its original English form:
  ## Purpose, ## ADDED/MODIFIED/REMOVED/RENAMED Requirements, ### Requirement:,
  #### Scenario:, SHALL/MUST. Terminology is defined by CONTEXT.md; the avoid-words
  flagged there must not be used.

  OpenSpec's "capability" means a capability domain under openspec/specs/, unrelated to
  the term Resource in this project's glossary.

  Capability domains (top-level paths under openspec/specs/; do not add new ones):
  - profile-catalog: profile definitions, global and project catalogs, override rules, CRUD
  - resource-reference: discovery and reference resolution for skills/extensions/MCP servers/tools, failure tiering
  - launcher: CLI arguments, initial profile selection, trust gating, instance generation
  - in-session-switch: /profile command family, runtime overlay, reload and rollback

  Ownership criteria for new facts (write each fact exactly once):
  - Changes when behavior changes → the behavior contracts in openspec/specs/
  - Changes only when the implementation mechanism changes → docs/architecture/overview.md
  - Hard to reverse, with an attractive rejected alternative → a new numbered file in docs/adr/
  - Product positioning, goals, non-goals → docs/prd.md
  - Terminology definitions → CONTEXT.md
  - User-facing overview, installation, usage, and configuration guidance → README.md and README.zh-CN.md
  When referencing facts owned elsewhere, link instead of restating, except that
  README editions explain current behavior and necessary limits concisely for users.
  These explanations derive from the owning contracts, product sources, and shipped
  schema; the original sources retain authority.
  README authoring principles are defined in AGENTS.md#readme-authoring.

rules:
  proposal:
    - 'Must include a "## Doc Impact" section listing the impact on docs/prd.md, docs/architecture/overview.md, CONTEXT.md, and docs/adr/ item by item; write "none: <reason>" when there is no impact.'
    - 'When adding a user-visible configuration field, explain why it cannot be replaced by discovery or a default value.'
    - 'For pure-documentation or pure-refactoring changes, set skip_specs: true; do not invent requirements to satisfy validation.'
  specs:
    - 'Do not restate the reasoning from docs/adr/ or the mechanisms from docs/architecture/overview.md; link when needed.'
    - 'Write only verifiable behavior: inputs, outputs, error conditions, boundaries. Implementation class names and library choices stay out.'
    - 'Requirement and scenario names and bodies are written in English; SHALL/MUST stay as-is.'
    - 'When an artifact must mention drift-prone set-class facts (enums, paths, versions), the spec SHALL constrain the artifact to "defer to the authoritative source"; the spec MUST NOT copy the set contents into itself or into artifact docs.'
  design:
    - 'If the design introduces a hard-to-reverse decision (file format, process architecture, external dependency lock), write one line "ADR required: <slug>" at that decision.'
    - 'A change that adds or modifies exported interfaces across modules, changes storage formats, or breaks contracts must include a design.md specifying the export surface: files, method names, signatures, error types.'
    - 'Only record decisions that carry judgment (a rejected alternative exists, or the export surface / sequencing / role ownership is affected); obvious decisions are not listed.'
  tasks:
    - 'Documentation-sync tasks must name concrete file paths; never write "update related docs".'
    - 'Every implementation task must carry a "Verification:" clause identifying the covered specs delta scenarios and the test command; a task without acceptance criteria is unacceptable.'
    - 'The check named in a "Verification:" clause must have a failure path. "Existing tests pass" is allowed only when existing tests genuinely cover the changed behavior; otherwise write a mechanical check (diff filtering, grep, content comparison) or add a test.'
    - 'Before declaring tasks ready, reconcile required outputs, spec scenarios, design decisions, documentation obligations, and each Verification command. A command that rejects required content (for example, a whole-document search that also matches a required migration row) must be scoped or revised; do not satisfy it by deleting required content.'
    - 'A task expected to modify existing test assertions must list the test file paths in its description.'
    - 'When a task artifact contains factual statements (enum values, path lists, identifier sets, version numbers), the "Verification:" clause must also provide a "fact → authoritative source" checklist (concrete paths of source files or external docs); when a class of facts has no authoritative source to list, the artifact MUST use a "defer to X" reference-style statement instead of copying the set.'

operations:
  apply:
    guidance:
      - 'Run npm run check and npm test after changing source code.'
  archive:
    guidance:
      - 'Before archiving, check the proposal''s "## Doc Impact" section item by item to confirm each has landed; do not archive if any has not.'
      - 'If the design is marked "ADR required", a new numbered file must exist in docs/adr/ before archiving.'
      - 'When a main spec and docs/architecture/overview.md restate the same fact, keep the one closer to its reader and turn the other into a link.'
      - 'If a main spec''s ## Purpose duplicates the positioning section of docs/prd.md, delete the restatement in the spec and link the PRD instead.'
